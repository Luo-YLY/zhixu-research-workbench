# Optional local bilingual RAG experiment. Apply after compose.local.yaml.
services:
  app:
    environment:
      ASSISTANT_PROVIDER: model-api
      MODEL_API_BASE_URL: http://model:11434/v1
      MODEL_API_MODEL: qwen3:4b
      EMBEDDING_PROVIDER: openai
      EMBEDDING_BASE_URL: http://model:11434/v1
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_REVISION: local-bge-m3-v1
    depends_on:
      model:
        condition: service_started

  model:
    image: ollama/ollama:latest
    gpus: all
    init: true
    restart: unless-stopped
    mem_limit: 12g
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - local_model_data:/root/.ollama:rw
    networks:
      - access

volumes:
  local_model_data:
